services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-erp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-erp}
      POSTGRES_DB: ${DB_NAME:-erp}
    # Sem isso, ao reiniciar o Docker/WSL a API volta e o banco não (API cai com ENOTFOUND db).
    restart: unless-stopped
    ports:
      # Só localhost: o banco não fica exposto na rede (nem na Tailscale).
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-erp}
      DB_PASSWORD: ${DB_PASSWORD:-erp}
      DB_NAME: ${DB_NAME:-erp}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-28800}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # Cifra o certificado A1 da NFS-e no banco; sem ela, não dá para instalar o certificado.
      CHAVE_CERTIFICADOS: ${CHAVE_CERTIFICADOS:-}
      # Ambiente de desenvolvimento: mantém o Swagger em /docs. Desligue ao publicar.
      SWAGGER_HABILITADO: ${SWAGGER_HABILITADO:-true}
      CORS_ORIGENS: ${CORS_ORIGENS:-}
      # Acesso local por http; em produção, com HTTPS, deixe o padrão (cookie só por conexão segura).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Atrás do nginx: necessário para o limite por IP e a auditoria verem o IP real.
      TRUST_PROXY: ${TRUST_PROXY:-1}
    restart: unless-stopped
    # Sem porta publicada: o acesso passa pelo nginx do serviço web, que repassa /api e /docs.
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      - api

volumes:
  pgdata:
