# Modelo: a imagem do nginx troca ${PORT}, ${NGINX_RESOLVER} e ${API_UPSTREAM} pelas variáveis de ambiente
# ao iniciar (padrões no Dockerfile valem para o Docker local; no Railway, as variáveis do serviço).
server {
  listen ${PORT};
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Resolve a API a cada requisição pelo DNS da rede interna, e não só na subida:
  # assim o nginx inicia mesmo se a API ainda não existir e acompanha a recriação dela.
  resolver ${NGINX_RESOLVER} valid=10s;
  set $api_upstream ${API_UPSTREAM};

  # API e documentação na mesma origem do frontend: o cookie de sessão não precisa de CORS.
  location /api/ {
    # Anexos de contas chegam a 10 MB (mais o envelope do multipart); a API impõe os limites de cada rota.
    client_max_body_size 11m;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Arquivos com hash no nome: podem ficar em cache para sempre.
  location /assets/ {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Rotas do React: qualquer caminho desconhecido devolve o index.html, que nunca fica em cache.
  location / {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
