server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # API e documentação na mesma origem do frontend: o cookie de sessão não precisa de CORS.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Arquivos com hash no nome: podem ficar em cache para sempre.
  location /assets/ {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Rotas do React: qualquer caminho desconhecido devolve o index.html, que nunca fica em cache.
  location / {
    include /etc/nginx/snippets/seguranca.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
