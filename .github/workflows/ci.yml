name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: erp
      DB_PASSWORD: erp
      DB_NAME: erp
      JWT_SECRET: segredo-somente-para-ci-com-mais-de-32-caracteres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Dependências de produção sem vulnerabilidades conhecidas
        run: npm audit --omit=dev --audit-level=moderate

      - name: Build
        run: npm run build

      - name: Migrations aplicam e batem com as entidades
        run: |
          npm run migration:run
          npm run migration:generate -- src/database/migrations/Pendente --check

      - name: Testes e2e
        run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Dependências de produção sem vulnerabilidades conhecidas
        run: npm audit --omit=dev --audit-level=moderate

      - name: Tipos
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build
        run: npm run build
